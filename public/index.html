<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PhotoWalk Valley</title>
<style>
  :root { --ink:#2b2340; --accent:#ff5d8f; --paper:#fffaf0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#bfe6ff;
    font-family:"Trebuchet MS",system-ui,sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none; }
  #c { display:block; width:100vw; height:100vh; touch-action:none; cursor:pointer; }
  .chip { position:fixed; background:var(--paper); border:3px solid var(--ink); border-radius:14px;
    box-shadow:0 4px 0 var(--ink); padding:8px 12px; font-weight:700; }
  #title { top:12px; left:12px; }
  #nearby { top:12px; right:12px; }
  #hint { bottom:16px; left:50%; transform:translateX(-50%); font-size:13px; white-space:nowrap; }
  #tools { position:fixed; top:66px; right:12px; display:flex; flex-direction:column; gap:10px; }
  .tool { width:52px; height:52px; border-radius:16px; border:3px solid var(--ink); background:var(--paper);
    font-size:24px; box-shadow:0 4px 0 var(--ink); cursor:pointer; padding:0; }
  .tool:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #snap { position:fixed; right:20px; bottom:20px; width:78px; height:78px; border-radius:50%;
    border:4px solid var(--ink); background:var(--accent); font-size:34px; box-shadow:0 5px 0 var(--ink); cursor:pointer; }
  #snap:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #zoom { right:112px; bottom:40px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #map { position:fixed; left:12px; bottom:12px; width:150px; height:150px; border:3px solid var(--ink);
    border-radius:14px; box-shadow:0 4px 0 var(--ink); background:#8fd16a; }
  #flash, #fade { position:fixed; inset:0; opacity:0; pointer-events:none; }
  #flash { background:#fff; transition:opacity .45s; }
  #fade { background:var(--paper); transition:opacity .35s; z-index:5; }
  #toast { top:64px; left:50%; transform:translate(-50%,-16px); opacity:0; transition:.3s; pointer-events:none; z-index:20; white-space:nowrap; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .modal { position:fixed; inset:0; background:rgba(43,35,64,.55); display:none; align-items:center;
    justify-content:center; padding:16px; z-index:10; }
  .modal.open { display:flex; }
  .card { background:var(--paper); border:4px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 var(--ink);
    padding:16px; width:min(540px,100%); max-height:100%; overflow:auto; }
  .card h2 { margin:0 0 6px; }
  .card p { margin:0 0 12px; }
  .card img { width:100%; border-radius:10px; border:3px solid var(--ink); display:block; }
  .card input[type=text] { width:100%; padding:10px; margin-top:10px; border:3px solid var(--ink); border-radius:10px; font:inherit; }
  .row { display:flex; gap:8px; margin-top:12px; align-items:center; }
  .btn { flex:1; padding:10px 14px; border:3px solid var(--ink); border-radius:12px; font:inherit; font-weight:700;
    background:#fff; color:var(--ink); cursor:pointer; box-shadow:0 3px 0 var(--ink); text-align:center; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.small { flex:0 0 auto; padding:8px 12px; }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn.liked { background:#ffe3ec; }
  .meta { margin-top:10px; font-size:15px; line-height:1.4; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .filters button { padding:6px 11px; border:3px solid var(--ink); border-radius:999px; background:#fff; color:var(--ink);
    font:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  .filters button.on { background:var(--ink); color:#fff; }
  .spots { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .spots .btn { text-align:left; }
  #viewCount { font-weight:700; min-width:64px; text-align:center; }
  @media (max-width:640px) { #map { width:110px; height:110px; } #hint { display:none; } #title, #nearby { font-size:13px; }
    .tool { width:44px; height:44px; font-size:20px; } .spots { grid-template-columns:1fr; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="chip">🌿 PhotoWalk Valley</div>
<div id="nearby" class="chip">Exploring…</div>
<div id="tools">
  <button class="tool" id="timeBtn" title="Time of day">🌄</button>
  <button class="tool" id="weatherBtn" title="Weather">☀️</button>
  <button class="tool" id="spotsBtn" title="Photo spots">🗺️</button>
</div>
<div id="hint" class="chip">Click to walk · Drag to look · Scroll to zoom · Click water to skip stones · Click animals · 📷 snap</div>
<canvas id="map" width="300" height="300"></canvas>
<div id="zoom" class="chip">🔍 1.0x</div>
<button id="snap" title="Take a picture here">📷</button>
<div id="flash"></div>
<div id="fade"></div>
<div id="toast" class="chip"></div>

<div id="snapModal" class="modal"><div class="card">
  <h2>Pin a photo here</h2>
  <img id="preview" alt="Your photo">
  <div class="filters" id="filters"></div>
  <input id="caption" type="text" maxlength="140" placeholder="Say something about this spot…">
  <input id="author" type="text" maxlength="30" placeholder="Your name">
  <div class="row"><label class="btn">🖼 Use my own photo instead<input id="file" type="file" accept="image/*" hidden></label></div>
  <div class="row"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">📌 Pin it here</button></div>
</div></div>

<div id="viewModal" class="modal"><div class="card">
  <img id="viewImg" alt="Photo">
  <div class="meta" id="viewMeta"></div>
  <div class="row">
    <button class="btn small" id="prevBtn">◀</button>
    <span id="viewCount"></span>
    <button class="btn small" id="nextBtn">▶</button>
    <button class="btn" id="likeBtn">❤️ 0</button>
    <button class="btn small" id="close">Close</button>
  </div>
</div></div>

<div id="spotsModal" class="modal"><div class="card">
  <h2>📸 Photo spots</h2>
  <p>Jump to a scenic place in the valley.</p>
  <div class="spots" id="spotList"></div>
  <div class="row"><button class="btn" id="spotsClose">Close</button></div>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const INK = 0x2b2340;

// ---------- helpers ----------
let seed = 7741;
const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = Math.random;
const pickR = a => a[Math.floor(R() * a.length)];
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const yawTo = (dx, dz) => Math.atan2(-dx, -dz);

// ---------- terrain shape ----------
const WATER = 0;
const LAKE = { x: 40, z: 30, r: 26 }, POOL = { x: -30, z: -82, r: 7 };
const RIVER = [[-30, -82], [-28, -70], [-21, -50], [-6, -30], [13, -12], [28, 8]];
const PATHS = [
  [[0, 50], [6, 38], [14, 30]],
  [[0, 50], [-12, 22], [-20, -12], [-28, -40], [-34, -60]],
  [[-15, -60], [0, -55], [30, -50], [66, -50]],
  [[-34, -60], [-40, -72]],
  [[0, 50], [-30, 38], [-62, 24]],
  [[-62, 24], [-74, -10], [-78, -44]],
  [[0, 50], [-6, 75], [-10, 90]],
  [[0, 50], [25, 72], [70, 72], [90, 56]],
  [[66, -50], [88, 0], [92, 50]],
];
function segDist(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}
function polyDist(px, pz, P) { let m = 1e9; for (let i = 0; i < P.length - 1; i++) m = Math.min(m, segDist(px, pz, P[i][0], P[i][1], P[i + 1][0], P[i + 1][1])); return m; }
const pathDist = (x, z) => { let m = 1e9; for (const p of PATHS) m = Math.min(m, polyDist(x, z, p)); return m; };
const hill = (x, z, cx, cz, a, r) => a * Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / (r * r));

function rawHeight(x, z) {
  let h = 4 + 2.2 * Math.sin(x * 0.03) * Math.cos(z * 0.025) + 1.2 * Math.sin(x * 0.07 + 1) * Math.sin(z * 0.06)
    + 0.35 * Math.sin(x * 0.23 + z * 0.17) + 0.25 * Math.cos(x * 0.31 - z * 0.27);
  h += hill(x, z, 70, -50, 7, 28) + hill(x, z, -80, -50, 11, 22) + hill(x, z, 95, 55, 12, 24) + hill(x, z, -10, 100, 2, 20);
  const r = Math.hypot(x, z), a = Math.atan2(z, x);
  h += smooth(125, 185, r) * (28 + 12 * Math.sin(a * 5 + 1) + 7 * Math.sin(a * 13)) + smooth(150, 200, r) * 10;
  h += 20 * smooth(-91, -96, z) * smooth(60, 28, Math.abs(x + 30)); // plateau + waterfall cliff
  const dr = polyDist(x, z, RIVER); h = lerp(h, -1.3, 1 - smooth(2.6, 7.5, dr));
  const dp = Math.hypot(x - POOL.x, z - POOL.z); h = lerp(h, -1.8, 1 - smooth(POOL.r - 2, POOL.r + 4, dp));
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z), la = Math.atan2(z - LAKE.z, x - LAKE.x);
  const lr = LAKE.r + 3 * Math.sin(la * 3) + 2 * Math.cos(la * 5);
  h = lerp(h, -3.5, 1 - smooth(lr - 7, lr + 5, dl));
  return h;
}

// walkable decks (bridge + dock)
const DECKS = [];
function addDeck(x0, x1, zc, w, y0, y1, arch) { const d = { x0, x1, z0: zc - w / 2, z1: zc + w / 2, zc, w, y0, y1, arch }; DECKS.push(d); return d; }
let bl = -24.5, br = -24.5;
while (rawHeight(bl, -60) < 1.0 && bl > -45) bl -= 0.5;
while (rawHeight(br, -60) < 1.0 && br < -5) br += 0.5;
const bridge = addDeck(bl - 1.5, br + 1.5, -60, 2.8, rawHeight(bl - 1.5, -60) + 0.05, rawHeight(br + 1.5, -60) + 0.05, 1.3);
let dx0 = 26; while (dx0 > -10 && rawHeight(dx0, 30) < 1.2) dx0 -= 0.5;
const dock = addDeck(dx0 - 1, Math.min(dx0 + 15, 32), 30, 2.6, rawHeight(dx0 - 1, 30) + 0.08, 0.9, 0);
const deckAt = (x, z) => { for (const d of DECKS) if (x >= d.x0 && x <= d.x1 && z >= d.z0 && z <= d.z1) return d; return null; };
const deckY = (d, x) => { const t = (x - d.x0) / (d.x1 - d.x0); return lerp(d.y0, d.y1, t) + d.arch * Math.sin(Math.PI * t); };
const groundY = (x, z) => { const d = deckAt(x, z); return d ? deckY(d, x) : rawHeight(x, z); };

// ---------- renderer / scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe6ff, 70, 240);
const BASE_FOV = 70;
const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.1, 1200);
camera.rotation.order = 'YXZ';

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6fae4f, 0.5);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 400 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.08;
scene.add(ambient, hemi, sun, sun.target);

const grad = new THREE.DataTexture(new Uint8Array([105, 175, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const matCache = new Map();
const toon = c => { if (!matCache.has(c)) matCache.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: grad })); return matCache.get(c); };
const outlineMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
function outline(mesh, s = 1.06) { const o = new THREE.Mesh(mesh.geometry, outlineMat); o.scale.setScalar(s); mesh.add(o); return mesh; }
function M(geo, color, x, y, z, parent, outlined = true) {
  const m = new THREE.Mesh(geo, typeof color === 'number' ? toon(color) : color);
  m.position.set(x, y, z); if (outlined) outline(m);
  m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m;
}

const timeU = { value: 0 }, nightU = { value: 0 };
const fogU = { uFogColor: { value: new THREE.Color() }, uFogNear: { value: 70 }, uFogFar: { value: 240 } };
function sway(mat, amt) {
  mat.onBeforeCompile = s => {
    s.uniforms.uTime = timeU;
    s.vertexShader = 'uniform float uTime;\n' + s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      float swPh = 0.0;
      #ifdef USE_INSTANCING
        swPh = instanceMatrix[3].x * 0.21 + instanceMatrix[3].z * 0.17;
      #endif
      float swK = max(position.y, 0.0) * ${amt.toFixed(3)};
      transformed.x += sin(uTime * 1.4 + swPh) * swK;
      transformed.z += cos(uTime * 1.1 + swPh) * swK * 0.6;`);
  };
  mat.customProgramCacheKey = () => 'sway' + amt;
  return mat;
}

// canvas textures
function emojiTex(e, bg = '#fffaf0') {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = bg; x.strokeStyle = '#2b2340'; x.lineWidth = 8;
  x.beginPath(); x.arc(64, 64, 52, 0, Math.PI * 2); x.fill(); x.stroke();
  x.font = '60px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 64, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function dotTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
function streakTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 3; x.beginPath(); x.moveTo(32, 2); x.lineTo(32, 62); x.stroke();
  return new THREE.CanvasTexture(c);
}
function petalTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.fillStyle = '#ffb7d5'; x.strokeStyle = '#f48fb8'; x.lineWidth = 3;
  x.beginPath(); x.ellipse(32, 32, 24, 13, 0.6, 0, Math.PI * 2); x.fill(); x.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const DOT = dotTex(), STREAK = streakTex(), PETAL = petalTex();

// ---------- terrain mesh ----------
const COL = { sandDeep: new THREE.Color(0xc9b27e), sand: new THREE.Color(0xf2e2ae), grassA: new THREE.Color(0x9bd66f),
  grassB: new THREE.Color(0x6fbf5a), grassC: new THREE.Color(0xc4dd66), path: new THREE.Color(0xdcb886),
  rock: new THREE.Color(0x9a92a6), rockB: new THREE.Color(0x7f7891), snow: new THREE.Color(0xffffff), pink: new THREE.Color(0xf7c6d9) };
const tc = new THREE.Color();
function terrainColor(x, z, h) {
  const s = Math.abs(rawHeight(x + 0.8, z) - h) + Math.abs(rawHeight(x, z + 0.8) - h);
  if (h < -0.1) return tc.copy(COL.sandDeep);
  if (h < 0.8) return tc.copy(COL.sand);
  if (h > 40) return tc.copy(COL.snow);
  if (s > 1.3 || h > 31) return tc.copy(COL.rock).lerp(COL.rockB, 0.5 + 0.5 * Math.sin(x * 0.3 + z * 0.2));
  tc.copy(COL.grassA).lerp(COL.grassB, 0.5 + 0.5 * Math.sin(x * 0.09 + Math.cos(z * 0.07) * 2));
  const ds = Math.hypot(x - 70, z + 50); if (ds < 24) tc.lerp(COL.grassC, 0.55 * (1 - ds / 24));
  const dg = Math.hypot(x + 65, z - 20); if (dg < 18) tc.lerp(COL.pink, 0.35 * (1 - dg / 18));
  const pd = pathDist(x, z); if (pd < 2.4) tc.lerp(COL.path, 1 - smooth(1.2, 2.4, pd));
  if (h > 24) tc.lerp(COL.rock, (h - 24) / 7 * 0.6);
  return tc;
}
{
  const SEG = 170, TS = 420;
  const g = new THREE.PlaneGeometry(TS, TS, SEG, SEG); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, cols = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), h = rawHeight(x, z);
    p.setY(i, h); const c = terrainColor(x, z, h); cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3)); g.computeVertexNormals();
  const terrain = new THREE.Mesh(g, new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: grad, flatShading: true }));
  terrain.receiveShadow = true; scene.add(terrain);
}

// ---------- water ----------
const DT = 256, depthData = new Uint8Array(DT * DT);
for (let j = 0; j < DT; j++) for (let i = 0; i < DT; i++) {
  const h = rawHeight(-210 + 420 * (i + 0.5) / DT, -210 + 420 * (j + 0.5) / DT);
  depthData[j * DT + i] = clamp(-h / 4, 0, 1) * 255;
}
const depthTex = new THREE.DataTexture(depthData, DT, DT, THREE.RedFormat);
depthTex.minFilter = depthTex.magFilter = THREE.LinearFilter; depthTex.needsUpdate = true;
const waterMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: { uTime: timeU, uNight: nightU, uDepth: { value: depthTex }, uDeep: { value: new THREE.Color(0x2a86d1) },
    uShallow: { value: new THREE.Color(0x7fdcec) }, uSky: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3(0, 1, 0) },
    uSunCol: { value: new THREE.Color() }, ...fogU },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uTime, uNight, uFogNear, uFogFar; uniform sampler2D uDepth;
    uniform vec3 uDeep, uShallow, uSky, uSunDir, uSunCol, uFogColor; varying vec3 vW;
    void main(){
      float d = texture2D(uDepth, (vW.xz + 210.0) / 420.0).r;
      vec3 col = mix(uShallow, uDeep, smoothstep(0.0, 0.55, d));
      float r = sin(vW.x*0.55 + uTime*1.2 + sin(vW.z*0.35 + uTime*0.8)*1.5) * sin(vW.z*0.5 - uTime + sin(vW.x*0.3)*1.5);
      col += vec3(0.12) * step(0.78, r);
      vec3 V = normalize(cameraPosition - vW);
      col = mix(col, uSky, pow(1.0 - clamp(V.y, 0.0, 1.0), 4.0) * 0.7);
      vec3 Rf = reflect(-V, vec3(0.0, 1.0, 0.0));
      float sp = pow(max(dot(Rf, normalize(uSunDir)), 0.0), 60.0);
      col += uSunCol * smoothstep(0.15, 0.3, sp) * step(0.55, r) * 0.9;
      float foam = 1.0 - smoothstep(0.05, 0.1, d + 0.03 * sin(uTime*2.0 + vW.x*0.7 + vW.z*0.5));
      col = mix(col, vec3(1.0), foam * 0.85);
      col *= mix(1.0, 0.4, uNight);
      col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, length(cameraPosition - vW)));
      gl_FragColor = vec4(col, 0.93);
      #include <colorspace_fragment>
    }`,
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), waterMat);
water.rotation.x = -Math.PI / 2; water.position.y = WATER; scene.add(water);

// waterfall: a ribbon of water hugging the cliff, flowing into the pool
{
  const W = 7, SZ = 60, z0 = -125, z1 = -82, cols = 5, pos = [], uv = [], idx = [];
  let len = 0, prev = null;
  for (let j = 0; j <= SZ; j++) {
    const z = lerp(z0, z1, j / SZ), yc = Math.max(rawHeight(-30, z) + 0.35, 0.06);
    if (prev) len += Math.hypot(z - prev[0], yc - prev[1]); prev = [z, yc];
    for (let i = 0; i < cols; i++) {
      const x = -30 - W / 2 + W * i / (cols - 1);
      pos.push(x, Math.max(rawHeight(x, z) + 0.35, 0.06), z); uv.push(i / (cols - 1), len / 4);
    }
  }

// photo clusters: pop the cards out with a staggered springy bounce
function updatePhotos(dt, t) {
  if (clustersDirty) rebuildClusters();

  for (const c of clusters) {
    const d = Math.hypot(c.x - player.x, c.z - player.z), isNear = d < NEAR;
    if (isNear && !c.near) {
      c.since = 0;
      const top = c.members[0].p;
      toast(c.n >= 5 ? `📍 Popular spot! ${c.n} photos here` : c.n > 1 ? `📍 ${c.n} photos here — top by ${top.author}` : `📸 A photo by ${top.author} popped up!`);
    }
    c.near = isNear; c.since = (c.since || 0) + dt;
    if (isNear) { nearPhotos += c.n; if (!nearSpot || c.n > nearSpot.n) nearSpot = c; }
    // keep the whole arrangement framed: cards back away so they stay at least VIEW_D in front of you
    let ux = c.x - player.x, uz = c.z - player.z;
    if (d < 0.5) { ux = -Math.sin(player.yaw); uz = -Math.cos(player.yaw); } else { ux /= d; uz /= d; }
    const D = Math.max(d, VIEW_D + (c.n > 5 ? 2 : c.n > 1 ? 1 : -2));
    c.holder.position.x += (player.x + ux * D - c.x - c.holder.position.x) * Math.min(1, dt * 6);
    c.holder.position.z += (player.z + uz * D - c.z - c.holder.position.z) * Math.min(1, dt * 6);
    c.holder.rotation.y = Math.atan2(-ux, -uz);
    c.pin.visible = d < FAR;
    // from afar the pin guides you there; up close it tucks away and the photos take over
    c.pinK = (c.pinK ?? 1) + ((isNear ? 0 : 1) - (c.pinK ?? 1)) * Math.min(1, dt * 5);
    c.pin.scale.setScalar(Math.max(0.001, c.pinS * c.pinK));
    c.pin.visible = d < FAR && c.pinK > 0.02;
    if (c.badge) c.badge.position.y = 2.2 + Math.sin(t * 2 + c.x) * 0.12;
    c.pin.rotation.y = t * 0.6;
    if (c.more) c.more.visible = isNear;
    c.members.forEach((e, i) => {
      if (!e.mesh || e.mesh.parent !== c.holder) return;

// ---------- loop ----------
const clock = new THREE.Clock();
let mapTick = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  timeU.value = t;
  let moving = false;
  if (!modalOpen()) {
    const turn = (keys['arrowleft'] || keys['q'] ? 1 : 0) - (keys['arrowright'] || keys['e'] ? 1 : 0);
    player.yaw += turn * 2 * dt;
    const fwd = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
    const side = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    if (fwd || side) {
      player.target = null;
      const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw), st = SPEED * (keys['shift'] ? 1.7 : 1) * dt;
      tryMove((-sy * fwd + cy * side) * st, (-cy * fwd - sy * side) * st); moving = true;
    }
  }
  if (player.target) {
    const dx = player.target.x - player.x, dz = player.target.z - player.z, dist = Math.hypot(dx, dz);
    if (dist < 0.2) player.target = null;
    else { const step = Math.min(dist, SPEED * dt); if (tryMove(dx / dist * step, dz / dist * step) < step * 0.3) player.target = null; moving = true; }
  }
  const gy = groundY(player.x, player.z) + EYE;
  player.camY += (gy - player.camY) * (1 - Math.exp(-dt * 12));
  player.bob = (player.bob || 0) + (moving ? dt * 11 : 0);
  camera.position.set(player.x, player.camY + (moving ? Math.sin(player.bob) * 0.05 : 0), player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  if (hover) {
    setRay(hover.x, hover.y);
    if (ray.intersectObjects(visibleCards()).length) { cursor.visible = false; canvas.style.cursor = 'zoom-in'; }
    else {
      const g = pickGround();
      canvas.style.cursor = 'pointer';
      cursor.visible = !!g && g.dist < 90;
      if (g) { cursor.position.set(g.x, g.y + 0.06, g.z); cursor.material.color.set(g.water ? 0x9be7ff : 0xffffff); }
    }
    hover = null;
  }

  updateAtmosphere(dt);
  updateLife(dt, t);
  updatePhotos(dt, t);
  skyGroup.position.copy(camera.position);
  sun.position.set(player.x + cur.dir.x * 150, cur.dir.y * 150, player.z + cur.dir.z * 150);
  sun.target.position.set(player.x, 0, player.z);
  if ((mapTick = (mapTick + 1) % 3) === 0) drawMap();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

  const names = ['Mika', 'Jun', 'Ava', 'Leo', 'Sora', 'Nina', 'Kai', 'Iris', 'Theo', 'Luna', 'Ren', 'Zoe'];
  const shots = [
    ...Array.from({ length: 16 }, (_, i) => ({ spot: 1, cap: ['Rainbow at the falls! 🌈', 'Mist on my face 💦', 'Best view in the valley', 'Waterfall vibes', 'Took 20 tries for this', 'So peaceful here'][i % 6] })),
    ...Array.from({ length: 7 }, (_, i) => ({ spot: 2, cap: ['Balloons over the lake 🎈', 'Dock life', 'Saw a fish jump!', 'Calm water'][i % 4] })),
    ...Array.from({ length: 5 }, (_, i) => ({ spot: 4, cap: ['Cherry blossoms 🌸', 'Picnic spot!', 'Pink everywhere'][i % 3] })),
    ...Array.from({ length: 3 }, (_, i) => ({ spot: 6, cap: ['Sunflowers 🌻', 'Golden field'][i % 2] })),
    ...Array.from({ length: 3 }, (_, i) => ({ spot: 7, cap: ['Ancient ruins 🏛️', 'History!'][i % 2] })),
    { spot: 8, cap: 'Campfire stories 🔥' }, { spot: 5, cap: 'Windmill on the hill' }, { spot: 3, cap: 'Bridge over the river' },
  ];
  toast('✨ Creating demo pins…');
  const times = [0, 1, 2, 3];
  for (let i = 0; i < shots.length; i++) {
    const sh = shots[i], s = SPOTS[sh.spot];
    setTime(times[i % 4], true);
    teleport({ ...s, x: s.x + (R() - .5) * 2.5, z: s.z + (R() - .5) * 2.5 }, true);
    player.yaw += (R() - .5) * 0.5;
    for (let k = 0; k < 3; k++) await new Promise(r => requestAnimationFrame(r));
    const src = capture();
    const p = await postPhoto({ image: src.toDataURL('image/jpeg', 0.8), x: player.x, z: player.z, yaw: player.yaw, caption: sh.cap, author: `${names[i % names.length]} (demo)` });
    const likes = Math.floor(R() * R() * 14);
    for (let k = 0; k < likes; k++) await fetch(`/api/photos/${p.id}/like`, { method: 'POST' });
  }
  setTime(0, true); teleport(SPOTS[1], true);
  history.replaceState(null, '', location.pathname);
  await sync(); toast('📍 Demo pins ready — look around the waterfall!');
}

window.photowalk = { player }; // handy for debugging in the console

// ---------- start ----------
setTime(0, true); setWeather(0);
teleport(SPOTS[0], true);
sync();
setInterval(sync, 5000);
frame();
if (new URLSearchParams(location.search).get('demo') === '1') setTimeout(runDemo, 600);
else setTimeout(() => toast('🌿 Welcome! Try 🌄 time, ☀️ weather and 🗺️ spots'), 800);
</script>
</body>
